function renderBooks(list,target){target.innerHTML=list.length?'':'<div class="empty">暂时没有符合条件的作品 ♡</div>';for(const b of list){const node=document.createElement('article');node.className='book';const rec=records[b.id]||{};node.innerHTML=`<div class="bookhead"><button class="booktitle" type="button">${esc(b.title)}</button><span class="chip">${esc(b.cp)}</span><span class="status">${esc(b.status)}</span><button class="pill" style="padding:3px 9px" data-heart title="收藏">${rec.favorite?'♥':'♡'}</button></div><p class="bookpreview">${esc(b.note||'暂无推荐语')}</p><div class="bookbottom"><a class="btn" href="${esc(safeUrl(b.url))}" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a><button type="button" class="expand">查看详情 ＋</button></div><div class="detail hidden"><p>${esc(b.note||'暂无推荐语')}</p><div class="actions"><a class="btn primary" href="${esc(safeUrl(b.url))}" target="_blank" rel="noopener noreferrer">打开原文 ↗</a><button class="btn" data-state="want">${rec.state==='want'?'✓ ':''}想读</button><button class="btn" data-state="reading">${rec.state==='reading'?'✓ ':''}在读</button><button class="btn" data-state="done">${rec.state==='done'?'✓ ':''}已读</button><button class="btn" data-state="clear">清除状态</button><button class="btn" data-comments>评论</button>${profile?.is_admin?'<button class="btn" data-edit>编辑</button>':''}</div><div class="comments hidden"></div></div>`;node.querySelector('.expand').onclick=()=>node.querySelector('.booktitle').click();node.querySelector('.booktitle').onclick=()=>node.querySelector('.detail').classList.toggle('hidden');node.querySelector('[data-heart]').onclick=()=>updateRecord(b.id,{favorite:!rec.favorite});node.querySelectorAll('[data-state]').forEach(x=>x.onclick=()=>updateRecord(b.id,{state:x.dataset.state==='clear'?null:x.dataset.state}));node.querySelector('[data-comments]').onclick=()=>toggleComments(b,node.querySelector('.comments'));if(profile?.is_admin)node.querySelector('[data-edit]').onclick=()=>{navigate('account');$('adminId').value=b. async function updateRecord(id,change){const next={...(records[id]||{}),...change};if(user&&client){const {error}=await client.from('reading_records').upsert({user_id:user.id,book_id:id,state:next.state||null,favorite:!!next.favorite},{onConflict:'user_id,book_id'});if(error){toast('保存失败：'+error.message);return}}records[id]=next;storeLocal();if(view==='shelf')renderShelf();else renderLibrary()}
function renderShelf(){const opts=[['全部','全部'],['want','想读'],['reading','在读'],['done','已读'],['favorite','收藏']];$('shelfFilters').replaceChildren();opts.forEach(([v,t])=>{let b=document.createElement('button');b.className='pill'+(shelfFilter===v?' active':'');b.textContent=t;b.onclick=()=>{shelfFilter=v;renderShelf()};$('shelfFilters').append(b)});$('shelfHint').textContent=user?'你的书架已经连接到账号，可以跨设备同步。':'当前为此浏览器的本地书架。连接 Supabase 并登录后可跨设备同步。';renderBooks(books.filter(b=>{let r=records[b.id]||{};return shelfFilter==='全部'?(r.state||r.favorite):shelfFilter==='favorite'?r.favorite:r.state===shelfFilter}),$('shelfList'))}
async function toggleComments(b,box){box.classList.toggle('hidden');if(box.classList.contains('hidden'))return;if(!configured){box.innerHTML='<p class="notice">评论功能需要先连接 Supabase。当前版本不支持公开评论。</p>';return}box.innerHTML='<p class="muted">正在读取评论…</p>';const {data,error}=await client.from('comments').select('id,user_id,display_name,body,spoiler,created_at').eq('book_id',b.id).order('created_at',{ascending:false}).limit(100);if(error){box.textContent='评论读取失败：'+error.message;return}box.replaceChildren();const heading=document.createElement('h3');heading.textContent='读者评论 · '+data.length;box.append(heading);for(const c of data){const div=document.createElement('div');div.className='comment';const head=document.createElement('div');head.className='who';head.textContent=(c.display_name||'读者')+' · '+new Date(c.created_at).toLocaleDateString('zh-CN');div.append(head);const p=document.createElement('p');p.textContent=c.spoiler?'⚠ 含剧透，点击展开':' '+c.body;if(c.spoiler){p.style.cursor='pointer';p.onclick=()=>p.textContent=p.textContent.startsWith('⚠')?c.body:'⚠ 含剧透，点击展开'}div.append(p);if(user&&(c.user_id===user.id||profile?.is_admin)){const del=document.createElement('button');del.className='btn';del.textContent='删除';del.onclick=async()=>{if(!confirm('确定删除这条评论？'))return;const {error}=await client.from('comments').delete().eq('id',c.id);if(error)toast(error.message);else{box.classList.add('hidden');toggleComments(b,box)}};div.append(del)}box.append(div)}if(!data.length){const p=document.createElement('p');p.className='muted';p.textContent='还没有评论，来留下第一条感想吧。';box.append(p)}if(user){const form=document.createElement('form');form.className='form';form.innerHTML='<textarea maxlength="1500" placeholder="写下你的读后感…" required></textarea><label><input type="checkbox"> 包含剧透（默认折叠）</label><button class="btn primary">发布评论</button>';form.onsubmit=async e=>{e.preventDefault();const body=form.querySelector('textarea').value.trim();if(!body)return;const {error}=await client.from('comments').insert({book_id:b.id,user_id:user.id,display_name:profile?.display_name||'读者',body,spoiler:form.querySelector('input').checked});if(error)toast(error.message);else{box.classList.add('hidden');toggleComments(b,box)}};box.append(form)}else{const p=document.createElement('p');p.className='muted';p.textContent='登录后可以发表评论。';box.append(p)}}
function renderAccount(){const el=$('accountContent');if(!configured){el.innerHTML='<div class="notice">云端功能尚未配置。当前可以搜索、筛选、收藏和标记已读，数据只保存在本浏览器。按照随附的 SETUP.md 配置 Supabase 后即可启用注册、同步、评论和管理员功能。</div>';return}if(user){el.innerHTML=`<p>已登录：<strong>${esc(user.email||'用户')}</strong></p><p class="muted">${profile?.is_admin?'馆主管理员':'读者账号'}</p><button class="btn" id="logout">退出登录</button>`;$('logout').onclick=()=>client.auth.signOut();$('adminPanel').classList.toggle('hidden',!profile?.is_admin)}else{el.innerHTML='<p class="muted">邮箱注册 / 登录。注册可能需要邮件验证。</p><form class="form" id="loginForm"><input type="email" name="email" required placeholder="邮箱"><input type="password" name="password" required minlength="6" placeholder="密码（至少 6 位）"><div class="row"><button class="btn primary" type="submit" data-action="login">登录</button><button class="btn" type="submit" data-action="signup">注册</button></div></form><p class="muted" id="authMessage"></p>';let action='login';el.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action=b.dataset.action);$('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const email=f.get('email'),password=f.get('password');const res=action==='signup'?await client.auth.signUp({email,password}):await client.auth.signInWithPassword({email,password});$('authMessage').textContent=res.error?res.error.message:action==='signup'?'注册请求已提交，请按邮件提示完成验证。':'登录成功。'}}}
async function loadProfile(){profile=null;if(!user||!client)return;const {data}=await client.from('profiles').select('display_name,is_admin').eq('id',user.id).maybeSingle();profile=data||{display_name:'读者',is_admin:false}}
async function loadRecords(){if(!user){records=localRecords();return}const {data,error}=await client.from('reading_records').select('book_id,state,favorite').eq('user_id',user.id);if(error){console.warn(error);records={};return}records={};(data||[]).forEach(r=>records[r.book_id]={state:r.state,favorite:r.favorite})}
async function loadBooks(){if(!configured){books=[...initial];return}const {data,error}=await client.from('books').select('id,cp,title,status,note,url,sort_order').order('sort_order',{ascending:true});if(error){console.warn('Books fetch failed',error);books=[...initial];return}books=data||[]}
async function refresh(){await loadBooks();await loadProfile();await loadRecords();counts();renderLibrary();renderShelf();renderAccount();$('authButton').textContent=user?'我的账号':'登录 / 注册';$('backendState').textContent=configured?'云端书库':'本地演示版 · 尚未连接云端'}
$('randomBtn').onclick=()=>{const b=books[Math.floor(Math.random()*books.length)];$('randomResult').innerHTML=`<div class="detail"><strong>${esc(b.title)}</strong> · ${esc(b.cp)} · ${esc(b.status)}<p>${esc(b.note)}</p><a href="${esc(safeUrl(b.url))}" target="_blank" rel="noopener noreferrer">打开原文 ↗</a></div>`};
$('adminReset').onclick=()=>{$('adminForm').reset();$('adminId').value=''};
$('adminForm').onsubmit=async e=>{e.preventDefault();if(!profile?.is_admin||!user)return;const id=$('adminId').value;const row={title:$('adminTitle').value.trim(),cp:$('adminCp').value,status:$('adminStatus').value,url:$('adminUrl').value.trim(),note:$('adminNote').value.trim()};if(!/^https:\/\//.test(row.url)){toast('请输入 https:// 开头的原文链接');return}if(!id)row.sort_order=books.length+1;const result=id?await client.from('books').update(row).eq('id',id):await client.from('books').insert(row);$('adminMessage').textContent=result.error?'保存失败：'+result.error.message:'保存成功！';if(!result.error){$('adminReset').click();await refresh()}};
async function init(){if(configured){try{const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');client=mod.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data}=await client.auth.getUser();user=data.user;client.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(refresh,0)});await refresh()}catch(e){console.error(e);$('backendState').textContent='云端连接失败：'+e.message;books=[...initial];records=localRecords();counts();renderLibrary();renderAccount()}}else{records=localRecords();counts();renderLibrary();renderAccount();$('backendState').textContent='本地演示版 · 尚未连接云端'}}init();
</script></body></html>
