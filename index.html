const data=raw.trim().split('\n').map((s,i)=>{const [group,title,status,desc,url]=s.split('|');return {id:i,group,title,status,desc,url}});let group='全部',filter='全部',query='';const fav=new Set(JSON.parse(localStorage.getItem('wish-favs')||'[]')),read=new Set(JSON.parse(localStorage.getItem('wish-read')||'[]'));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.getElementById('tabs').innerHTML=['全部','riyu','shiku','收藏'].map(x=>`<button class="${x===group?'active':''}" data-group="${x}">${x==='全部'?'全部作品':x==='收藏'?'♡ 我的收藏':x}</button>`).join('');document.getElementById('filters').innerHTML=['全部','已完结','连载','短篇','未读'].map(x=>`<button class="${x===filter?'active':''}" data-filter="${x}">${x}</button>`).join('');const items=data.filter(x=>(group==='全部'||(group==='收藏'?fav.has(x.id):x.group===group))&&(filter==='全部'||(filter==='未读'?!read.has(x.id):filter==='连载'?x.status.includes('连载'):x.status===filter))&&[x.title,x.desc,x.status,x.group].join(' ').toLowerCase().includes(query));document.getElementById('count').textContent=`找到 ${items.length} 篇作品 · 已读 ${read.size} · 收藏 ${fav.size}`;document.getElementById('grid').innerHTML=items.length?items.map(x=>`<article class="item"><div class="top"><span class="tag">${esc(x.group)} · ${esc(x.status)}</span><button class="heart ${fav.has(x.id)?'on':''}" data-fav="${x.id}" aria-label="收藏">${fav.has(x.id)?'♥':'♡'}</button></div><h2>${esc(x.title)}</h2><div class="desc">${esc(x.desc)}</div><div class="bottom"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a><label class="read"><input type="checkbox" data-read="${x.id}" ${read.has(x.id)?'checked':''}> 已读</label></div></article>`).join(''):'<div class="empty">没有找到匹配的作品 ♡</div>'}document.addEventListener('click',e=>{let el=e.target.closest('[data-group],[data-filter],[data-fav]');if(!el)return;if(el.dataset.group!==undefined)group=el.dataset.group;else if(el.dataset.filter!==undefined)filter=el.dataset.filter;else{let n=Number(el.dataset.fav);fav.has(n)?fav.delete(n):fav.add(n);localStorage.setItem('wish-favs',JSON.stringify([...fav]))}render()});document.addEventListener('change',e=>{if(e.target.dataset.read!==undefined){let n=Number(e.target.dataset.read);e.target.checked?read.add(n):read.delete(n);localStorage.setItem('wish-read',JSON.stringify([...read]));render()}});document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});render();
